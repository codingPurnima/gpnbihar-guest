
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPNBIHAR NEWS STUDIO</title>
  </head>
  <body>
    <main>
      <header>
        <h1>GPNBIHAR NEWS STUDIO</h1>
        <p id="status">Ready to start</p>
      </header>

      <section class="controls">
        <label id="accessCodeLabel">
          Anchor access code
          <input
            id="accessCode"
            type="password"
            autocomplete="current-password"
            placeholder="Enter anchor access code"
          />
        </label>

        <label id="guestNameLabel" hidden>
          Your name
          <input
            id="guestName"
            value=""
            maxlength="60"
            placeholder="Enter your name"
          />
        </label>

        <button id="joinBtn">Join studio</button>
        <button id="micBtn" disabled>Mute microphone</button>
        <button id="cameraBtn" disabled>Turn camera off</button>
        <button id="leaveBtn" disabled>Leave studio</button>

        <button id="inviteBtn" hidden>Copy guest invitation link</button>
      </section>

      <h2 id="localHeading">Anchor preview</h2>
      <div id="localVideo" class="video-grid"></div>

      <h2>Other participants</h2>
      <div id="remoteVideo" class="video-grid"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
